<h1>Registro</h1>

<form action="" method="post">

    <div>
        <label for="txtNombre"><b>Nombre:</b></label>
        <input type="text" id="txtNombre" name="txtNombre" placeholder="Ingrese su nombre" required/>

        <label for="txtApellido"><b>Apellido:</b></label>
        <input type="text" id="txtApellido" name="txtApellido" placeholder="Ingrese su apellido" required/>
    </div>

    <div>
        <label for="txtEmail"><b>Email:</b></label>
        <input type="email" id="txtEmail" name="txtEmail" required/>

        <label for="txtPass"><b>Contraseña:</b></label>
        <input type="password" id="txtPass" name="txtPass" required/>
    </div>

    <div>
        <label for="date"><b>Fecha de nacimiento:</b></label>
        <input type="date" id="date" name="date" required/>

        <input type="submit" value="Confirmar"/>
    </div>

</form>
